<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order - TimeMeal</title>
    <link rel="stylesheet" href="order.css" />
    <script src="navbar.js"></script>
  </head>
  <body>
    <!-- header -->
    <header>
      <div class="logo">TimeMeal</div>
      <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      <nav id="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="order.html">Order</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <div class="container">
      <!-- sidebar -->
      <div class="sidebar">
        <h3>Categories</h3>
        <br>
        <div class="category active" onclick="filterCategory('all', this)">
          All
        </div>
        <div class="category" onclick="filterCategory('pizza', this)">
          Pizza
        </div>
        <div class="category" onclick="filterCategory('burger', this)">
          Burger
        </div>
        <div class="category" onclick="filterCategory('desi', this)">Desi</div>
        <div class="category" onclick="filterCategory('chinese', this)">
          Chinese
        </div>
        <div class="category" onclick="filterCategory('drinks', this)">
          Drinks
        </div>
        <div class="category" onclick="filterCategory('fastfood', this)">
          Fast Food
        </div>
      </div>

      <!-- products -->
      <div class="products">
        <div class="topbar">
          <input
            type="text"
            id="search"
            class="search"
            placeholder="Search food..."
            onkeyup="applyFilters()"
          />
        </div>
        <div class="grid" id="products"></div>
      </div>

      <!-- cart -->
      <div class="cart">
        <h3>Your Bag</h3>
        <ul id="cartItems"></ul>

        <p class="total" id="total"></p>

        <button class="action-btn clear" onclick="clearCart()">
          Cancel All
        </button>
        <button class="action-btn pay" onclick="proceedPay()">
          Proceed to Pay
        </button>
      </div>
    </div>

    <!-- footer -->
    <footer>
      <p>&copy; 2026 TimeMeal. All rights reserved.</p>
    </footer>

    <script src="index.js"></script>
  </body>
</html>
